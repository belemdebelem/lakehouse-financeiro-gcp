[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-financeiro-gcp"
version = "0.1.0"
description = "Lakehouse financeiro sintético em GCP (portfólio)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-bigquery==1.12.3",
    "dbt-core==1.12.6",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-storage>=3.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: acessa GCS real e é executado apenas com RUN_GCS_INTEGRATION=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
