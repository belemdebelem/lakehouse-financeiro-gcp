name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_REGION: southamerica-east1
  BQ_DATASET_BRONZE: bronze
  BQ_DATASET_SILVER: silver
  BQ_DATASET_GOLD: gold
  BQ_DATASET_OPS: ops
  DBT_TARGET: dev

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lockfile
        run: uv lock --check
      - name: Sync
        run: uv sync --extra dev --frozen
      - name: Pytest
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check .
      - name: SQLFluff
        run: uv run sqlfluff lint dbt/models
      - name: dbt parse
        env:
          GCP_PROJECT_ID: demo-project
          GOOGLE_CLOUD_PROJECT: demo-project
        run: |
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          uv run dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse

  dbt_compile:
    name: dbt compile
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DBT_SA }}
      - name: Sync
        run: uv sync --extra dev --frozen
      - name: dbt compile
        run: |
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          uv run dbt compile --project-dir dbt --profiles-dir dbt
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-compiled-sql
          path: dbt/target/compiled
          retention-days: 7

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - name: Init
        run: terraform init -backend=false -input=false
        working-directory: infrastructure/terraform
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: terraform validate -var 'project_id=demo-project' -var 'bucket_name=demo-bucket'
        working-directory: infrastructure/terraform
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
